  <style>
    :root {
      --coral: #db6a41;
      --ink: #211d1d;
      --cream: #fff8f4;
      --yellow: #fcea8b;
      --stone: #c5b5a7;
      --green: #71806a;
      --surface: rgba(255, 248, 244, 0.90);
      --surface-border: rgba(219, 106, 65, 0.22);

    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      font-family: var(--font-stack); color: var(--ink);
      background: radial-gradient(circle at center, #fffdf9 0%, #edddcf 100%);
    }
    #canvas-container { position: absolute; inset: 0; z-index: 1; }
    #css2d-container { position: absolute; inset: 0; z-index: 2; pointer-events: none; }

    /* UI 通用樣式 */
    .glass {
      background: var(--surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--surface-border);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(33, 29, 29, 0.08);
      pointer-events: auto;
    }
    .btn {
      background: var(--cream);
      border: 1px solid #e0cfc2;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { background: #fff; transform: translateY(-1px); border-color: var(--coral); }
    .btn.active { background: var(--coral); color: #fff; border-color: var(--coral); }

    /* 頂部品牌牌 */

      position: absolute; top: 20px; left: 24px; z-index: 10;

    #brand-badge p { font-size: 12px; color: #6b5c53; font-weight: 500; }

    /* 左側詳細卡片 */
    #detail-card {
      position: absolute; top: 96px; left: 24px; width: 340px; max-height: calc(100vh - 120px);
      z-index: 10; padding: 22px; display: none; flex-direction: column; gap: 14px;

    #detail-card h2 { font-size: 19px; color: var(--ink); display: flex; align-items: center; justify-content: space-between; }

    .drawer-item:hover { border-color: var(--coral); background: #fff; transform: translateX(-2px); }
    .drawer-item-title { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 3px; }
    .drawer-item-sub { font-size: 11px; color: #7a6a61; }

    /* 底部操作工具列 HUD */
    #hud-toolbar {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 10; padding: 8px 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .divider { width: 1px; height: 18px; background: #d7c5ba; margin: 0 4px; }

    #log-panel {

    /* 3D 浮動標籤 (CSS2D) */
    .css2d-label {
      padding: 4px 9px; border-radius: 8px; font-size: 11px; font-weight: 700;
      color: var(--ink); background: var(--surface); border: 1px solid var(--surface-border);

      white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.06);

    .css2d-label.active { background: var(--coral); color: #fff; }

    /* 載入畫面 */
    #loader {

      align-items: center; justify-content: center; gap: 16px;

    .spinner {

      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 900px) {
      #brand-badge { top: 12px; left: 12px; padding: 8px 12px; }
      #list-drawer { display: none; }

      #detail-card { left: 12px; right: 12px; width: auto; max-height: 48vh; bottom: 84px; top: auto; }
      #hud-toolbar { bottom: 12px; width: calc(100% - 24px); justify-content: center; }
    }
  </style>

    // ── 偽隨機 (mulberry32) ──
    let seedVal = 19840502;
    function mulberry32() {
      let t = seedVal += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    const rnd = () => mulberry32();

    // ── 穩定內建 2D 噪聲產生器（避免第三方 SimplexNoise API 不一致）──
    const perm = new Uint8Array(512);
    const pSource = new Uint8Array(256);
    for (let i = 0; i < 256; i++) pSource[i] = i;
    for (let i = 255; i > 0; i--) {
      const r = Math.floor(rnd() * (i + 1));
      const tmp = pSource[i]; pSource[i] = pSource[r]; pSource[r] = tmp;
    }
    for (let i = 0; i < 512; i++) perm[i] = pSource[i & 255];

    function noise2D(x, y) {
      const F2 = 0.5 * (Math.sqrt(3.0) - 1.0);
      const G2 = (3.0 - Math.sqrt(3.0)) / 6.0;
      let s = (x + y) * F2;
      let i = Math.floor(x + s);
      let j = Math.floor(y + s);
      let t = (i + j) * G2;
      let X0 = i - t;
      let Y0 = j - t;
      let x0 = x - X0;
      let y0 = y - Y0;
      let i1 = x0 > y0 ? 1 : 0;
      let j1 = x0 > y0 ? 0 : 1;
      let x1 = x0 - i1 + G2;
      let y1 = y0 - j1 + G2;
      let x2 = x0 - 1.0 + 2.0 * G2;
      let y2 = y0 - 1.0 + 2.0 * G2;
      let ii = i & 255;
      let jj = j & 255;
      let t0 = 0.5 - x0 * x0 - y0 * y0;
      let n0 = 0.0, n1 = 0.0, n2 = 0.0;
      if (t0 > 0) {
        t0 *= t0;
        let gi0 = perm[ii + perm[jj]] % 8;
        let gx = [1,-1,1,-1,1,-1,0,0][gi0], gy = [1,1,-1,-1,0,0,1,-1][gi0];
        n0 = t0 * t0 * (gx * x0 + gy * y0);
      }
      let t1 = 0.5 - x1 * x1 - y1 * y1;
      if (t1 > 0) {
        t1 *= t1;
        let gi1 = perm[ii + i1 + perm[jj + j1]] % 8;
        let gx = [1,-1,1,-1,1,-1,0,0][gi1], gy = [1,1,-1,-1,0,0,1,-1][gi1];
        n1 = t1 * t1 * (gx * x1 + gy * y1);
      }
      let t2 = 0.5 - x2 * x2 - y2 * y2;
      if (t2 > 0) {
        t2 *= t2;
        let gi2 = perm[ii + 1 + perm[jj + 1]] % 8;
        let gx = [1,-1,1,-1,1,-1,0,0][gi2], gy = [1,1,-1,-1,0,0,1,-1][gi2];
        n2 = t2 * t2 * (gx * x2 + gy * y2);
      }
      return 70.0 * (n0 + n1 + n2);
    }

    // ── 常數數值 ──
    const R = 2.02;
    const SPACING = 2.28;
    const TOP = 0.65;
    const WATER_Y = -0.18;

    function hexToWorld(q, r) {
      const x = Math.sqrt(3) * SPACING * (q + r / 2);
      const z = 1.5 * SPACING * r;
      return { x, z };
    }

    // ── Three.js 場景變數 ──
    let scene, camera, renderer, labelRenderer, controls;

    // InstancedMesh Kit
    const instanceRegistry = {};
    function pushPart(kind, matrix, colorHex) {
      if (!instanceRegistry[kind]) instanceRegistry[kind] = [];
      instanceRegistry[kind].push({ matrix: matrix.clone(), color: new THREE.Color(colorHex) });
    }

    // ── 地面動態貼圖 ──
    function createGroundCanvasTexture(type) {
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 256;
      const ctx = cv.getContext('2d');
      if (type === 'park') {
        ctx.fillStyle = '#9cb88d'; ctx.fillRect(0,0,256,256);
        ctx.fillStyle = '#8fad7f';
        for(let i=0;i<400;i++){ ctx.fillRect(rnd()*256, rnd()*256, 3, 3); }
      } else if (type === 'brick') {
        ctx.fillStyle = '#dfcca8'; ctx.fillRect(0,0,256,256);
        ctx.strokeStyle = '#cbbb98'; ctx.lineWidth = 2;
        for(let y=0; y<256; y+=16){
          ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(256,y); ctx.stroke();
          const off = (y%32===0)?0:8;
          for(let x=off; x<256; x+=16){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+16); ctx.stroke(); }
        }
      } else {
        ctx.fillStyle = '#8c8a87'; ctx.fillRect(0,0,256,256);
        ctx.fillStyle = '#7a7875';
        for(let i=0;i<300;i++){ ctx.fillRect(rnd()*256, rnd()*256, 2, 2); }
      }
      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    // ── 建立山巒盆地與水面 ──
    function buildLandscape() {
      const basinGeo = new THREE.PlaneGeometry(160, 160, 120, 120);
      basinGeo.rotateX(-Math.PI / 2);
      const pos = basinGeo.attributes.position;
      const colors = [];
      const colMountainHigh = new THREE.Color('#58694f');
      const colMountainLow = new THREE.Color('#94a883');
      const colShore = new THREE.Color('#dfd1b8');

      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const dist = Math.hypot(x, z);
        let h = -0.3;
        if (dist > 18) {
          const smooth = THREE.MathUtils.smoothstep(dist, 18, 55);
          const noise = noise2D(x * 0.035, z * 0.035) * 4.5 + noise2D(x * 0.08, z * 0.08) * 1.5;
          h += smooth * (6.5 + noise);
          h = Math.floor(h * 2.2) / 2.2;
        }
        pos.setY(i, h);

        const mixed = new THREE.Color();
        if (h < 0.2) mixed.copy(colShore);
        else if (h < 4) mixed.lerpColors(colMountainLow, colMountainHigh, h / 4);
        else mixed.copy(colMountainHigh);
        colors.push(mixed.r, mixed.g, mixed.b);
      }
      basinGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      basinGeo.computeVertexNormals();

      const basinMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0.02 });
      const basinMesh = new THREE.Mesh(basinGeo, basinMat);
      basinMesh.receiveShadow = true;
      scene.add(basinMesh);

      const waterGeo = new THREE.CircleGeometry(52, 64);
      waterGeo.rotateX(-Math.PI / 2);
      const waterMat = new THREE.MeshStandardMaterial({
        color: 0x9bc7c5,
        roughness: 0.25,
        metalness: 0.1,
        transparent: true,
        opacity: 0.88
      });
      const water = new THREE.Mesh(waterGeo, waterMat);
      water.position.y = WATER_Y;
      water.receiveShadow = true;
      scene.add(water);
    }

    // ── 建立 10 個政策島嶼 ──
    const waypointsGraph = [];
    function buildIslands() {
      const hexShapeGeo = new THREE.CircleGeometry(R - 0.04, 6);
      hexShapeGeo.rotateZ(Math.PI / 6);
      hexShapeGeo.rotateX(-Math.PI / 2);

      DATA.islands.forEach((isle) => {
        const { x, z } = hexToWorld(isle.coord.q, isle.coord.r);
        isle.worldPos = { x, y: TOP, z };

        const isleGroup = new THREE.Group();
        isleGroup.position.set(x, 0, z);

        const tex = createGroundCanvasTexture(isle.groundType);
        tex.repeat.set(1.6, 1.6);
        const topMat = new THREE.MeshStandardMaterial({
          map: tex, roughness: 0.92,
          polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1
        });
        const topMesh = new THREE.Mesh(hexShapeGeo, topMat);
        topMesh.position.y = TOP;
        topMesh.receiveShadow = true;
        topMesh.userData = { type: 'island', raw: isle };
        isleGroup.add(topMesh);
        interactiveObjects.push(topMesh);
        islandMeshMap.set(isle.id, isleGroup);

        const sideGeo = new THREE.CylinderGeometry(R - 0.04, R - 0.04, TOP - WATER_Y, 6);
        sideGeo.rotateY(Math.PI / 6);
        const sideMat = new THREE.MeshStandardMaterial({ color: 0xb9a691, roughness: 0.96 });
        const sideMesh = new THREE.Mesh(sideGeo, sideMat);
        sideMesh.position.y = (TOP + WATER_Y) / 2;
        sideMesh.receiveShadow = true;
        isleGroup.add(sideMesh);

        const pathGeo = new THREE.RingGeometry(1.62, 1.84, 6);
        pathGeo.rotateZ(Math.PI / 6);
        pathGeo.rotateX(-Math.PI / 2);
        const pathMat = new THREE.MeshStandardMaterial({ color: 0xdec6b0, roughness: 0.9 });
        const pathMesh = new THREE.Mesh(pathGeo, pathMat);
        pathMesh.position.y = TOP + 0.005;
        pathMesh.receiveShadow = true;
        isleGroup.add(pathMesh);

        const foamGeo = new THREE.RingGeometry(R + 0.02, R + 0.22, 6);
        foamGeo.rotateZ(Math.PI / 6);
        foamGeo.rotateX(-Math.PI / 2);
        const foamMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.45 });
        const foamMesh = new THREE.Mesh(foamGeo, foamMat);
        foamMesh.position.y = WATER_Y + 0.01;
        isleGroup.add(foamMesh);

        const labelDiv = document.createElement('div');
        labelDiv.className = 'css2d-label';
        labelDiv.textContent = isle.name;
        labelDiv.onclick = (e) => { e.stopPropagation(); focusTarget(x, TOP, z, 'island', isle); };
        const labelObj = new CSS2DObject(labelDiv);
        labelObj.position.set(0, TOP + 1.25, 0);
        isleGroup.add(labelObj);

        scene.add(isleGroup);

        const nodeIndices = [];
        for (let i = 0; i < 6; i++) {
          const a1 = (i * 60) * Math.PI / 180;
          const a2 = ((i + 1) * 60) * Math.PI / 180;
          const vx = x + Math.cos(a1) * 1.72;
          const vz = z + Math.sin(a1) * 1.72;
          const vIdx = waypointsGraph.length;
          waypointsGraph.push({ x: vx, y: TOP + 0.02, z: vz, neighbors: [], isleId: isle.id });
          nodeIndices.push(vIdx);

          const mx = x + Math.cos((a1 + a2) / 2) * 1.58;
          const mz = z + Math.sin((a1 + a2) / 2) * 1.58;
          const mIdx = waypointsGraph.length;
          waypointsGraph.push({ x: mx, y: TOP + 0.02, z: mz, neighbors: [], isleId: isle.id, isEdgeMid: true });
          nodeIndices.push(mIdx);
        }
        for (let i = 0; i < nodeIndices.length; i++) {
          const curr = nodeIndices[i];
          const next = nodeIndices[(i + 1) % nodeIndices.length];
          waypointsGraph[curr].neighbors.push(next);
          waypointsGraph[next].neighbors.push(curr);
        }

        layoutIslandItems(isle, x, z);
      });

      buildBridges();
    }

    // ── 拱橋與路網相連 ──
    function buildBridges() {
      const islands = DATA.islands;
      for (let i = 0; i < islands.length; i++) {
        for (let j = i + 1; j < islands.length; j++) {
          const a = islands[i];
          const b = islands[j];
          const dq = Math.abs(a.coord.q - b.coord.q);
          const dr = Math.abs(a.coord.r - b.coord.r);
          const ds = Math.abs((-a.coord.q - a.coord.r) - (-b.coord.q - b.coord.r));
          if (Math.max(dq, dr, ds) === 1) {
            const p1 = a.worldPos;
            const p2 = b.worldPos;
            const midX = (p1.x + p2.x) / 2;
            const midZ = (p1.z + p2.z) / 2;
            const angle = Math.atan2(p2.z - p1.z, p2.x - p1.x);

            for (let k = 0; k < 9; k++) {
              const distStep = (k - 4) * 0.18;
              const bx = midX + Math.cos(angle) * distStep;
              const bz = midZ + Math.sin(angle) * distStep;
              const archY = TOP + 0.02 + Math.sin((k + 0.5) / 9 * Math.PI) * 0.1;
              const mtx = new THREE.Matrix4();
              mtx.makeRotationY(-angle + Math.PI / 2);
              mtx.setPosition(bx, archY, bz);
              pushPart('box', mtx, 0xbda289);
            }

            connectNearestWaypoints(a.id, b.id);
          }
        }
      }
    }

    function connectNearestWaypoints(isleIdA, isleIdB) {
      let minDist = 999;
      let pair = null;
      for (let i = 0; i < waypointsGraph.length; i++) {
        if (waypointsGraph[i].isleId !== isleIdA || !waypointsGraph[i].isEdgeMid) continue;
        for (let j = 0; j < waypointsGraph.length; j++) {
          if (waypointsGraph[j].isleId !== isleIdB || !waypointsGraph[j].isEdgeMid) continue;
          const d = Math.hypot(waypointsGraph[i].x - waypointsGraph[j].x, waypointsGraph[i].z - waypointsGraph[j].z);
          if (d < minDist) {
            minDist = d;
            pair = [i, j];
          }
        }
      }
      if (pair) {
        waypointsGraph[pair[0]].neighbors.push(pair[1]);
        waypointsGraph[pair[1]].neighbors.push(pair[0]);
      }
    }

    // ── 島內細項模型配置 ──
    function layoutIslandItems(isle, cx, cz) {
      const items = isle.items;
      const slots = [
        { x: 0, z: -0.55, scale: 1.0 },
        { x: -0.68, z: 0.35, scale: 0.85 },
        { x: 0.65, z: 0.38, scale: 0.85 }
      ];

      items.forEach((item, idx) => {
        const slot = slots[idx % slots.length];
        const wx = cx + slot.x;
        const wz = cz + slot.z;
        const scale = slot.scale;

        assembleArchetype(item.model, wx, TOP, wz, scale);

        const hitGeo = new THREE.BoxGeometry(0.75 * scale, 0.8 * scale, 0.75 * scale);
        const hitMat = new THREE.MeshBasicMaterial({ visible: false });
        const hitMesh = new THREE.Mesh(hitGeo, hitMat);
        hitMesh.position.set(wx, TOP + 0.4 * scale, wz);
        hitMesh.userData = { type: 'item', raw: item, parentIsland: isle };
        scene.add(hitMesh);
        interactiveObjects.push(hitMesh);
        itemNodes.push({ id: item.id, mesh: hitMesh, worldPos: new THREE.Vector3(wx, TOP, wz), data: item });

        const itemBadge = document.createElement('div');
        itemBadge.className = 'css2d-label';
        itemBadge.style.fontSize = '9.5px';
        itemBadge.textContent = item.name.slice(0, 7);
        itemBadge.onclick = (e) => { e.stopPropagation(); focusTarget(wx, TOP, wz, 'item', item, isle); };
        const cssObj = new CSS2DObject(itemBadge);
        cssObj.position.set(wx, TOP + 0.9 * scale, wz);
        scene.add(cssObj);
      });

      for (let i = 0; i < 6; i++) {
        const ang = (i * 60) * Math.PI / 180;
        const lx = cx + Math.cos(ang) * 1.82;
        const lz = cz + Math.sin(ang) * 1.82;
        pushPart('cylinder', new THREE.Matrix4().setPosition(lx, TOP + 0.2, lz), 0x5a5550);
        pushPart('glowsphere', new THREE.Matrix4().setPosition(lx, TOP + 0.42, lz), 0xfce881);

        if (rnd() > 0.3) {
          const bx = cx + Math.cos(ang + 0.4) * 1.68;
          const bz = cz + Math.sin(ang + 0.4) * 1.68;
          pushPart('ico', new THREE.Matrix4().setPosition(bx, TOP + 0.08, bz), rnd() > 0.5 ? 0x829c73 : 0xdb7763);
        }
      }
    }

    // ── 模型 Archetypes 組裝 ──
    function assembleArchetype(modelType, x, y, z, s) {
      const pos = (dx, dy, dz) => new THREE.Matrix4().setPosition(x + dx * s, y + dy * s, z + dz * s);

      switch (modelType) {

    // ── 批次繪製 (Instancing) ──
    function compileAllInstances() {
      const geoPool = {
        box: new THREE.BoxGeometry(0.32, 0.32, 0.32),
        rbox: new RoundedBoxGeometry(0.5, 0.4, 0.4, 3, 0.04),
        cylinder: new THREE.CylinderGeometry(0.04, 0.04, 0.4, 12),
        cone: new THREE.ConeGeometry(0.38, 0.35, 12),
        sphere: new THREE.SphereGeometry(0.12, 12, 12),
        ico: new THREE.IcosahedronGeometry(0.18, 1),
        dome: new THREE.SphereGeometry(0.2, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2),
        hip: new THREE.ConeGeometry(0.38, 0.24, 4),
        glowbox: new THREE.BoxGeometry(0.42, 0.22, 0.02),
        glowsphere: new THREE.SphereGeometry(0.09, 12, 10)
      };
      geoPool.hip.rotateY(Math.PI / 4);

      const standardMat = new THREE.MeshStandardMaterial({ roughness: 0.88, metalness: 0.05 });
      const glowMat = new THREE.MeshBasicMaterial();

      Object.entries(instanceRegistry).forEach(([kind, items]) => {
        const geo = geoPool[kind] || geoPool.box;
        const mat = kind.startsWith('glow') ? glowMat : standardMat;
        const instMesh = new THREE.InstancedMesh(geo, mat, items.length);
        instMesh.castShadow = true;
        instMesh.receiveShadow = true;

        items.forEach((item, idx) => {
          instMesh.setMatrixAt(idx, item.matrix);
          instMesh.setColorAt(idx, item.color);
        });
        instMesh.instanceMatrix.needsUpdate = true;
        if (instMesh.instanceColor) instMesh.instanceColor.needsUpdate = true;
        scene.add(instMesh);
      });
    }

    // ── 背景樹 ──
    function buildBackgroundFoliage() {
      const treeCount = 180;
      const coneTr = new THREE.ConeGeometry(0.4, 0.7, 5);
      const pineGeo = BufferGeometryUtils.mergeGeometries([
        coneTr.clone().translate(0, 0.8, 0),
        coneTr.clone().scale(0.8, 0.8, 0.8).translate(0, 1.2, 0),
        coneTr.clone().scale(0.6, 0.6, 0.6).translate(0, 1.5, 0)
      ]);
      const trunkGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.5, 5).translate(0, 0.25, 0);
      const singlePine = BufferGeometryUtils.mergeGeometries([pineGeo, trunkGeo]);

      const pineMesh = new THREE.InstancedMesh(singlePine, new THREE.MeshStandardMaterial({ color: 0x50694e, roughness: 0.95 }), treeCount);
      pineMesh.castShadow = true; pineMesh.receiveShadow = true;

      const dummy = new THREE.Object3D();
      let placed = 0;
      for (let i = 0; i < treeCount * 3 && placed < treeCount; i++) {
        const dist = 18 + rnd() * 32;
        const theta = rnd() * Math.PI * 2;
        const tx = Math.cos(theta) * dist;
        const tz = Math.sin(theta) * dist;
        const ty = noise2D(tx * 0.035, tz * 0.035) * 4.5 + THREE.MathUtils.smoothstep(dist, 18, 55) * 6.5 - 0.2;
        if (ty > 0.8) {
          dummy.position.set(tx, ty, tz);
          const sc = 0.8 + rnd() * 0.6;
          dummy.scale.set(sc, sc, sc);
          dummy.rotation.y = rnd() * Math.PI;
          dummy.updateMatrix();
          pineMesh.setMatrixAt(placed, dummy.matrix);
          placed++;
        }
      }
      pineMesh.instanceMatrix.needsUpdate = true;
      scene.add(pineMesh);
    }

    // ── Chibi 小人與協作路徑 ──
    let walkers = [];
    let collabLines = [];

    function setupWalkersAndCollaborations() {
      DATA.collaborations.forEach((collab, idx) => {
        const fromIsle = DATA.islands.find(is => is.id === collab.from);
        const toIsle = DATA.islands.find(is => is.id === collab.to);
        if (!fromIsle || !toIsle) return;

        const walker = new THREE.Group();
        const bodyGeo = new THREE.CylinderGeometry(0.09, 0.08, 0.18, 8);
        const bodyMat = new THREE.MeshStandardMaterial({
          color: collab.courier.includes('李昭靜') ? 0xdb6a41 : (collab.courier.includes('原民') ? 0xd9534f : 0x48647a),
          roughness: 0.8
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.12;
        walker.add(body);

        const headGeo = new THREE.SphereGeometry(0.12, 12, 10);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.7 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 0.28;
        walker.add(head);

        const cargoGeo = new THREE.BoxGeometry(0.12, 0.1, 0.12);
        const cargoMat = new THREE.MeshStandardMaterial({ color: 0xf5ce5b });
        const cargo = new THREE.Mesh(cargoGeo, cargoMat);
        cargo.position.set(0, 0.16, 0.12);
        walker.add(cargo);

        const startNodes = waypointsGraph.map((n, i) => ({ n, i })).filter(o => o.n.isleId === fromIsle.id);
        const endNodes = waypointsGraph.map((n, i) => ({ n, i })).filter(o => o.n.isleId === toIsle.id);

        const startIndex = startNodes[Math.floor(rnd() * startNodes.length)].i;
        const endIndex = endNodes[Math.floor(rnd() * endNodes.length)].i;
        const pathIndices = dijkstraPath(startIndex, endIndex);

        walker.position.set(waypointsGraph[startIndex].x, TOP, waypointsGraph[startIndex].z);
        scene.add(walker);

        walkers.push({
          mesh: walker,
          path: pathIndices.map(pi => waypointsGraph[pi]),
          currentSegment: 0,
          progress: rnd(),
          speed: 0.0035 + rnd() * 0.002,
          forward: true,
          collabData: collab
        });

        const pA = fromIsle.worldPos;
        const pB = toIsle.worldPos;
        const midX = (pA.x + pB.x) / 2;
        const midZ = (pA.z + pB.z) / 2;
        const curve = new THREE.QuadraticBezierCurve3(
          new THREE.Vector3(pA.x, TOP + 0.2, pA.z),
          new THREE.Vector3(midX, TOP + 1.8 + idx * 0.2, midZ),
          new THREE.Vector3(pB.x, TOP + 0.2, pB.z)
        );

        const lineGeo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(36));
        const lineMat = new THREE.LineDashedMaterial({
          color: collab.level === 'official' ? 0xdb6a41 : (collab.level === 'thematic' ? 0x56a3a6 : 0xbbbbbb),
          dashSize: 0.3, gapSize: 0.15, lineWidth: 2
        });
        const lineMesh = new THREE.Line(lineGeo, lineMat);
        lineMesh.computeLineDistances();
        scene.add(lineMesh);
        collabLines.push(lineMesh);
      });
    }

    // ── Dijkstra 最短路徑 ──
    function dijkstraPath(startIdx, targetIdx) {
      const dists = new Array(waypointsGraph.length).fill(Infinity);
      const prev = new Array(waypointsGraph.length).fill(null);
      const visited = new Set();
      dists[startIdx] = 0;

      for (let count = 0; count < waypointsGraph.length; count++) {
        let u = -1;
        let minD = Infinity;
        for (let i = 0; i < waypointsGraph.length; i++) {
          if (!visited.has(i) && dists[i] < minD) {
            minD = dists[i];
            u = i;
          }
        }
        if (u === -1 || u === targetIdx) break;
        visited.add(u);

        for (const v of waypointsGraph[u].neighbors) {
          if (visited.has(v)) continue;
          const w = Math.hypot(waypointsGraph[u].x - waypointsGraph[v].x, waypointsGraph[u].z - waypointsGraph[v].z);
          if (dists[u] + w < dists[v]) {
            dists[v] = dists[u] + w;
            prev[v] = u;
          }
        }
      }

      const path = [];
      let curr = targetIdx;
      while (curr !== null) {
        path.unshift(curr);
        curr = prev[curr];
      }
      return path.length > 1 ? path : [startIdx, targetIdx];
    }

    // ── 相機飛行控制 ──
    let isTransitioning = false;
    let flightStart = 0;
    const flightDuration = 800;
    let camStartPos = new THREE.Vector3();
    let camEndPos = new THREE.Vector3();
    let tgtStartPos = new THREE.Vector3();
    let tgtEndPos = new THREE.Vector3();

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function flyTo(targetVector, offsetVector) {
      camStartPos.copy(camera.position);
      camEndPos.copy(targetVector).add(offsetVector);
      tgtStartPos.copy(controls.target);
      tgtEndPos.copy(targetVector);

      flightStart = performance.now();
      isTransitioning = true;
    }

    function focusTarget(x, y, z, type, data, parentIsle = null) {
      const isMobile = window.innerWidth <= 900;
      const xOffset = isMobile ? 0 : -1.2;
      const targetVec = new THREE.Vector3(x + xOffset, y, z);
      const camOffset = type === 'island' ? new THREE.Vector3(2.7, 5.2, 6.0) : new THREE.Vector3(1.6, 2.5, 3.2);

      flyTo(targetVec, camOffset);
      showDetailCard(type, data, parentIsle);
      addLogEntry(`🔍 里民正在查看【${data.name}】重點建設內容`);
    }

        cardBadge.textContent = data.category;
        cardTimeline.textContent = '十全十美核心願景';
        cardTitle.textContent = data.name;
        cardDesc.textContent = data.desc;
        data.items.forEach(it => {
          const li = document.createElement('li');
          li.innerHTML = `<strong>${it.name}</strong><br><span style="font-size:11px;color:#7a6d65;">${it.desc}</span>`;
          li.onclick = (e) => { e.stopPropagation(); focusTarget(it.worldPos ? it.worldPos.x : data.worldPos.x, TOP, it.worldPos ? it.worldPos.z : data.worldPos.z, 'item', it, data); };
          li.style.cursor = 'pointer';
          cardFacts.appendChild(li);
        });
      } else {
        cardBadge.textContent = parentIsle ? parentIsle.name : '里政細項';
        cardTimeline.textContent = data.time || '即刻推動';

    // ── 右側抽屜 ──

    const tabCollab = document.getElementById('tab-collab');

    function renderDrawer(filter = '') {
      drawerContainer.innerHTML = '';
      if (currentTab === 'pillars') {
        DATA.islands.forEach(isle => {
          isle.items.forEach(item => {
            if (filter && !item.name.includes(filter) && !item.desc.includes(filter) && !isle.name.includes(filter)) return;

            div.className = 'drawer-item';

          });

    // ── 點擊射線拾取 ──
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      if (isTransitioning) isTransitioning = false;
      if (e.target.closest('#brand-badge') || e.target.closest('#detail-card') ||
          e.target.closest('#list-drawer') || e.target.closest('#hud-toolbar') ||
          e.target.closest('#log-panel') || e.target.classList.contains('css2d-label')) {
        return;
      }

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(interactiveObjects, false);
      if (intersects.length > 0) {
        const hit = intersects[0].object;
        const udata = hit.userData;
        if (udata.type === 'island') {
          focusTarget(hit.parent.position.x, TOP, hit.parent.position.z, 'island', udata.raw);
        } else if (udata.type === 'item') {
          focusTarget(hit.position.x, TOP, hit.position.z, 'item', udata.raw, udata.parentIsland);
        }
      }
    });

    // ── 主程式初始化 ──
    function init() {
      try {
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0xf6eee6, 0.012);

        const aspect = window.innerWidth / window.innerHeight;
        camera = new THREE.PerspectiveCamera(32, aspect, 0.3, 320);

        const dDist = window.innerWidth < 800 ? 46 : 30;
        const norm = new THREE.Vector3(0.24, 0.33, 0.87).normalize();
        camera.position.copy(norm.multiplyScalar(dDist));

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelContainer.appendChild(labelRenderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.07;
        controls.enablePan = false;
        controls.minPolarAngle = (25 * Math.PI) / 180;
        controls.maxPolarAngle = (70 * Math.PI) / 180;
        controls.minDistance = 3;
        controls.maxDistance = 72;
        controls.target.set(0, TOP, 0);

        hemiLight = new THREE.HemisphereLight(0xfceee6, 0x8a7a6e, 1.25);
        scene.add(hemiLight);

        sunLight = new THREE.DirectionalLight(0xfff7ea, 1.8);
        sunLight.position.set(22, 28, 18);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 80;
        sunLight.shadow.camera.left = -16;
        sunLight.shadow.camera.right = 16;
        sunLight.shadow.camera.top = 16;
        sunLight.shadow.camera.bottom = -16;
        sunLight.shadow.bias = -0.0004;
        scene.add(sunLight);

        buildLandscape();
        buildIslands();
        compileAllInstances();
        buildBackgroundFoliage();
        setupWalkersAndCollaborations();
        renderDrawer();

        setTimeSlot(DATA.timeSlots[1]);

        addLogEntry('✅ 山光里政策島載入完成！歡迎點擊探索');
        addLogEntry('🌸 李昭靜：「打造十全十美，從聆聽每一位里民開始」');

        setTimeout(() => {
          const loader = document.getElementById('loader');
          if (loader) {
            loader.style.transition = 'opacity 0.6s ease';
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 600);
          }
        }, 300);

        window.addEventListener('resize', onWindowResize);

      } catch (err) {
        console.error('Initialization failed', err);
        const st = document.getElementById('loader-status');
        if (st) st.innerHTML = `<span style="color:#e63946;">載入失敗：${err.message}。請確認支援 WebGL 且網路順暢。</span>`;
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ── 動畫循環 ──
    let lastTime = performance.now();
    function animate(currentTime) {
      requestAnimationFrame(animate);
      const delta = Math.min((currentTime - lastTime) / 1000, 0.1);
      lastTime = currentTime;

      simulatedHour = (simulatedHour + delta * 0.05) % 24;

      if (showFlow) {
        walkers.forEach(w => {
          if (w.path.length < 2) return;
          w.progress += w.speed;
          if (w.progress >= 1.0) {
            w.progress = 0;
            w.currentSegment++;
            if (w.currentSegment >= w.path.length - 1) {
              w.currentSegment = 0;
            }
          }
          const p1 = w.path[w.currentSegment];
          const p2 = w.path[w.currentSegment + 1];
          if (p1 && p2) {
            const curX = THREE.MathUtils.lerp(p1.x, p2.x, w.progress);
            const curZ = THREE.MathUtils.lerp(p1.z, p2.z, w.progress);
            w.mesh.position.set(curX, TOP, curZ);
            w.mesh.lookAt(p2.x, TOP, p2.z);
            w.mesh.position.y = TOP + Math.abs(Math.sin(w.progress * Math.PI * 4)) * 0.03;
          }
        });
      }

      if (isTransitioning) {
        const elapsed = currentTime - flightStart;
        const progress = Math.min(elapsed / flightDuration, 1.0);
        const t = easeInOutCubic(progress);

        camera.position.lerpVectors(camStartPos, camEndPos, t);
        controls.target.lerpVectors(tgtStartPos, tgtEndPos, t);

        if (progress >= 1.0) {
          isTransitioning = false;
        }
      }

      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }

    init();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
